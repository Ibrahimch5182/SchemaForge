[project]
name = "localsql"
version = "0.1.0"
description = "LocalSQL: fine-tuned Text-to-SQL system (Phase 1 - data foundation)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=0.23",
    "pydantic>=2.7",
    "sqlglot>=25.0",
    "pyyaml>=6.0",
    "fsspec>=2024.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
# Phase 8 backend API. httpx is required by FastAPI's TestClient.
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]
eval = [
    "func-timeout>=4.3.5",
    "psycopg2-binary>=2.9.13",
    "pymysql>=1.2.0",
]
model = [
    "torch>=2.4",
    "transformers>=4.46",
    "accelerate>=1.0",
    "bitsandbytes>=0.44",
]
# Phase 4 QLoRA smoke training. Deliberately does NOT list torch/
# transformers/accelerate/bitsandbytes again -- those already come from the
# "model" group, and Kaggle's own torch build should never be reinstalled.
# Install both together: `uv sync --group model --group train`.
train = [
    "peft>=0.13",
    "trl>=0.11",
]

[tool.uv]
default-groups = ["dev", "api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localsql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Windows: the shared user temp dir can intermittently deny pytest's
# numbered-tmpdir cleanup scan; keep tmp_path allocations project-local.
addopts = "--basetemp=.pytest_tmp"
