[project]
name = "localsql"
version = "0.1.0"
description = "LocalSQL: fine-tuned Text-to-SQL system (Phase 1 - data foundation)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=2.19",
    "huggingface-hub>=0.23",
    "pydantic>=2.7",
    "sqlglot>=25.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localsql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
