# Local full-stack validation (no public proxy, no HTTPS):
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build seed-db model-server backend
#   docker compose -f docker-compose.yml -f docker-compose.local.yml --profile frontend up --build frontend
# Publishes the backend on the loopback interface only. Development mode = dev CORS, /docs enabled.
services:
  backend:
    environment:
      SCHEMAFORGE_ENV: development
      SCHEMAFORGE_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SCHEMAFORGE_TRUSTED_PROXY_HOPS: "0"
    ports:
      - "127.0.0.1:8000:8000"
  frontend:
    profiles: [frontend]
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "127.0.0.1:5173:8080"
    networks: [edge]
