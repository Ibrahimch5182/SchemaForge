# SchemaForge Phase 8 backend configuration.
#
# Machine-specific paths are NEVER committed. The model runtime is configured
# through environment variables (see localsql.backend.config):
#   SCHEMAFORGE_LLAMA_EXE     path to llama-completion(.exe)
#   SCHEMAFORGE_BASE_GGUF     Q4_K_M base GGUF
#   SCHEMAFORGE_LORA_GGUF     LoRA GGUF (hot-loaded with --lora)
#   SCHEMAFORGE_LLAMA_THREADS optional CPU threads
#   SCHEMAFORGE_LLAMA_NGL     optional GPU layers (default 0 = CPU)
#   SCHEMAFORGE_DB_ROOT       optional override of databases.root
#   SCHEMAFORGE_BACKEND_CONFIG optional path to an alternative copy of this file

databases:
  # Allowed root: every registered `file` must resolve INSIDE this directory.
  # Relative paths are resolved against the repository root.
  root: .artifacts/phase8/databases
  entries:
    - id: demo
      file: demo.sqlite
      dialect: sqlite
      description: Deterministic demo database (created by scripts/smoke_phase8.py).

execution:
  timeout_seconds: 10
  max_rows: 500
  max_sql_chars: 20000

runtime:
  kind: llama_cpp
  # Inference settings (context, max tokens, seed, greedy decoding) come from
  # the Phase 7 config so serving matches what was benchmarked.
  phase7_config: configs/phase7.yaml
  # Per-request generation timeout (overrides phase7 inference.timeout_seconds).
  # Keep it below the frontend's VITE_QUERY_TIMEOUT_MS so the backend gives up first.
  timeout_seconds: 120
  # Bounded concurrency: at most N model processes at once, M more may wait up to
  # queue_wait_seconds each; further requests are rejected immediately (model_busy).
  max_concurrent_generations: 1
  max_waiting_requests: 2
  queue_wait_seconds: 20

api:
  # Browser origins allowed to call this API (Phase 9 frontend dev/preview servers).
  # Override with SCHEMAFORGE_CORS_ORIGINS (comma-separated). Never use "*".
  cors_allowed_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173

logging:
  level: INFO
